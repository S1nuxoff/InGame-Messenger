// InGame Messenger as a server plugin: Paper, Spigot, Purpur and Folia. The core, H2 and Concentus are packed into the
// jar, so the server downloads nothing; Gson comes with the server.
plugins {
    id 'java'
}

group = 'com.sinuxoff'
version = mod_version
base.archivesName = 'ingamemessenger-plugin'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // the Paper API is the Bukkit API plus Folia's schedulers, which are only used where the server has them
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
    implementation project(':core')
}

configurations {
    bundled { transitive = false }
}

dependencies {
    bundled "com.h2database:h2:${h2_version}"
    bundled "io.github.jaredmdobson:concentus:${concentus_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    // built for Java 17 (servers from 1.20.1) against the 1.21 API, using nothing 1.20 lacks
    disableAutoTargetJvm()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    def props = [version: version]
    inputs.properties props
    filesMatching('plugin.yml') {
        expand props
    }
}

jar {
    from(project(':core').sourceSets.main.output)
    from({ configurations.bundled.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/*/module-info.class', 'module-info.class'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.file('LICENSE'))
}
