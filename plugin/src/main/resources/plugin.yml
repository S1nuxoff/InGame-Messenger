name: InGameMessenger
version: '${version}'
main: com.sinuxoff.ingamemessenger.plugin.MessengerPlugin
api-version: '1.21'
folia-supported: true
author: S1nuxoff
website: https://github.com/S1nuxoff/InGame-Messenger
description: A messenger in the Minecraft chat. Players install the mod on their clients; players without it can still join and chat as usual.
libraries:
  - com.h2database:h2:${h2}
  - io.github.jaredmdobson:concentus:${concentus}
commands:
  messenger:
    description: InGame Messenger settings
    usage: /messenger reload | typing <true|false> | voice <true|false> | voice length <seconds> | voice keep <days>
    permission: ingamemessenger.admin
permissions:
  ingamemessenger.admin:
    description: Use /messenger
    default: op
