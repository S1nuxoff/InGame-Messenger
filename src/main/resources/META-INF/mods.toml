modLoader = "javafml"
loaderVersion = "[0,)"
license = "GPL-3.0-only"
issueTrackerURL = "https://github.com/S1nuxoff/InGame-Messenger/issues"

[[mods]]
modId = "ingamemessenger"
version = "${version}"
displayName = "InGame Messenger"
# players without the mod can join, and so can players with it on servers without it
displayTest = "IGNORE_ALL_VERSION"
logoFile = "ingamemessenger.png"
authors = "S1nuxoff"
displayURL = "https://github.com/S1nuxoff/InGame-Messenger"
description = '''
A messenger in the Minecraft chat: bubbles with faces, stickers and emoji, reactions, replies, @mentions, private chats, pictures, voice messages, polls and search through the whole history. Install it on the server and on the clients; players without it can still join and chat as usual.
'''

[[dependencies.ingamemessenger]]
modId = "forge"
mandatory = true
versionRange = "${loader_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.ingamemessenger]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"
