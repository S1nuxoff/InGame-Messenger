name: Build

# builds every push to dev (all versions compile?), a version tag (git tag v0.1.0 && git push origin v0.1.0: also the release),
# pull requests, or on demand from the Actions tab
on:
  push:
    branches: [dev]
    tags: ['v*']
    # text and pictures only: nothing to build (tags ignore this)
    paths-ignore: ['**.md', 'docs/**', '.github/release-notes/**', 'LICENSE']
  pull_request:
  workflow_dispatch:

# a newer run for the same tag or pull request cancels the older one
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release on a tag
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      # Minecraft as prepared by Loom, ModDevGradle and ForgeGradle: slow to produce, the same until a version changes
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            ~/.gradle/caches/neoformruntime
            ~/.gradle/caches/minecraftforge
          key: minecraft-${{ hashFiles('gradle.properties', 'versions/*/gradle.properties', 'stonecutter.gradle') }}
          restore-keys: minecraft-

      # downloads from Mojang and the loaders' mavens time out now and then: one retry
      - name: Build every version and the plugin
        run: ./gradlew :core:test buildAll :plugin:build --stacktrace || (sleep 30 && ./gradlew :core:test buildAll :plugin:build --stacktrace)

      - uses: actions/upload-artifact@v4
        with:
          name: ingamemessenger-jars
          path: |
            versions/*/build/libs/ingamemessenger-*.jar
            plugin/build/libs/ingamemessenger-plugin-*.jar
            !versions/*/build/libs/*-slim.jar
            !versions/*/build/libs/*-mojmap.jar
          if-no-files-found: error
          retention-days: 7

      # a version tag becomes a release with every jar (not -slim, -mojmap); the text is .github/release-notes/<tag>.md,
      # where __TAG__ and __VERSION__ (the download links) are filled in
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag=${{ github.ref_name }}
          sed -e "s/__TAG__/$tag/g" -e "s/__VERSION__/${tag#v}/g" .github/release-notes/$tag.md > release-notes.md
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            versions/*/build/libs/ingamemessenger-*[0-9].jar
            plugin/build/libs/ingamemessenger-plugin-*[0-9].jar
