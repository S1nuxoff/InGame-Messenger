name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build every version
        run: ./gradlew :core:test buildAll --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ingamemessenger-jars
          path: versions/*/build/libs/ingamemessenger-*.jar
          if-no-files-found: error
          retention-days: 7
