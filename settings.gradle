// InGame Messenger: one build for every Minecraft version and loader.
//   core              - plain Java, no Minecraft: the protocol, the chat's server, sound, pictures, text, web clients (tested)
//   src/main          - the Minecraft side: shared by every loader (the chat's look and input, the server's glue, mixins),
//                       plus each loader's own entry points, config, network and events (packages neoforge/, fabric/)
//   versions/<mc>-<loader> - one jar each (its versions in its gradle.properties); Stonecutter turns the
//                       //? if >=1.21.4 { ... } comments in src/ into the code for that version
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.kikugie.dev/releases' }
    }
}

plugins {
    // downloads the Java toolchain each Minecraft version needs when the build JDK is another one
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = 'ingamemessenger'
include 'core'

stonecutter {
    centralScript = 'build.gradle'
    kotlinController = false

    create(rootProject) {
        // every Minecraft version, on each loader it's built for
        def mc = { String minecraft, List<String> loaders ->
            loaders.each { version("$minecraft-$it", minecraft) }
        }
        mc('1.21.1', ['neoforge', 'fabric', 'forge'])
        mc('1.21.4', ['neoforge', 'fabric', 'forge'])
        mc('1.21.5', ['neoforge', 'fabric', 'forge'])
        mc('1.21.8', ['neoforge', 'fabric', 'forge'])   // 1.21.6 - 1.21.8
        mc('1.21.10', ['neoforge', 'fabric', 'forge'])  // 1.21.9 - 1.21.10
        mc('1.21.11', ['neoforge', 'fabric', 'forge'])
        // 26.x: one jar a release (26.1 covers 26.1 - 26.1.2), built against its latest patch
        version('26.1-neoforge', '26.1.2')
        version('26.1-fabric', '26.1.2')
        version('26.1-forge', '26.1.2')
        mc('26.2', ['neoforge', 'fabric', 'forge'])
        mc('26.3', ['neoforge', 'fabric', 'forge'])

        // the version the sources in git are written for
        vcsVersion = '1.21.1-neoforge'
    }
}
