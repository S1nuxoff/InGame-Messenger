// InGame Messenger for one Minecraft version on one loader (versions/<minecraft>-<loader>, its versions in its
// gradle.properties): core and src/main compiled into one jar, without the other loader's code and files.
def loader = property('loader') as String
def mcVersion = property('minecraft_version') as String

// //? if fabric { ... }, //? if neoforge { ... } and //? if forge { ... } in the sources
stonecutter.constants.match(loader, 'fabric', 'neoforge', 'forge')

// names Mojang changed: the sources keep the old ones, Stonecutter writes the new ones for the newer versions
def since = { String v -> stonecutter.current.parsed.matches(">=$v") }
def before = { String v -> stonecutter.current.parsed.matches("<$v") }
// before 1.19.3 the matrices are Mojang's own, not JOML's
stonecutter.replacements.string(before('1.19.3')) {
    replace('org.joml.Matrix4f', 'com.mojang.math.Matrix4f')
}
// before 1.19.3 widgets have public x / y fields instead of getters and setters, and no HolderLookup.Provider
stonecutter.replacements.string(before('1.19.3')) {
    replace('input.getX()', 'input.x')
    replace('input.getY()', 'input.y')
    replace('line.setY(textY(h))', 'line.y = (textY(h))')
    replace('input.setY(textY(sh))', 'input.y = (textY(sh))')
    replace('net.minecraft.core.HolderLookup.Provider', 'net.minecraft.core.RegistryAccess')
    replace('net.minecraft.core.registries.BuiltInRegistries.', 'net.minecraft.core.Registry.')
}
// before 1.19 text components are made with their classes' constructors
stonecutter.replacements.string(before('1.19')) {
    // the qualified ones get two spaces: each replacement must stay reversible
    replace('net.minecraft.network.chat.Component.translatable(', 'new  net.minecraft.network.chat.TranslatableComponent(')
    replace('net.minecraft.network.chat.Component.literal(', 'new  net.minecraft.network.chat.TextComponent(')
    replace('net.minecraft.network.chat.Component.empty()', 'new  net.minecraft.network.chat.TextComponent("")')
    replace('Component.translatable(', 'new net.minecraft.network.chat.TranslatableComponent(')
    replace('Component.literal(', 'new net.minecraft.network.chat.TextComponent(')
    replace('Component.empty()', 'new net.minecraft.network.chat.TextComponent("")')
}
// before 1.20 the level is a field
stonecutter.replacements.string(before('1.20')) {
    replace('.level().dimension()', '.level.dimension()')
}
stonecutter.replacements.regex(since('1.21.11')) {
    replace(/\bResourceLocation\b/, 'Identifier', /\bIdentifier\b/, 'ResourceLocation')
}
// a resource key's name: location() became identifier()
stonecutter.replacements.regex(since('1.21.11')) {
    replace(/\.location\(\)/, '.identifier()', /\.identifier\(\)/, '.location()')
}
// a player's profile became a record: getName() / getId() are name() / id()
stonecutter.replacements.regex(since('1.21.9')) {
    replace(/\b(getGameProfile|getProfile)\(\)\.getName\(\)/, '$1().name()', /\b(getGameProfile|getProfile)\(\)\.name\(\)/, '$1().getName()')
}
stonecutter.replacements.regex(since('1.21.9')) {
    replace(/\b(getGameProfile|getProfile|getOwner)\(\)\.getId\(\)/, '$1().id()', /\b(getGameProfile|getProfile|getOwner)\(\)\.id\(\)/, '$1().getId()')
}
stonecutter.replacements.regex(since('26.1')) {
    replace(/\bGuiGraphics\b/, 'GuiGraphicsExtractor', /\bGuiGraphicsExtractor\b/, 'GuiGraphics')
}
// 26.2 split the game's Gui: the screens stay on mc.gui, the HUD (chat, the line over the hotbar) is mc.gui.hud
stonecutter.replacements.regex(since('26.2')) {
    replace(/\.gui\.(getChat|setOverlayMessage|getGuiTicks|getTabList)\(/, '.gui.hud.$1(', /\.gui\.hud\.(getChat|setOverlayMessage|getGuiTicks|getTabList)\(/, '.gui.$1(')
}
stonecutter.replacements.regex(since('26.2')) {
    replace(/\b(mc|minecraft|Minecraft\.getInstance\(\))\.screen\b(?!\()/, '$1.gui.screen()', /\b(mc|minecraft|Minecraft\.getInstance\(\))\.gui\.screen\(\)/, '$1.screen')
}
stonecutter.replacements.regex(since('26.2')) {
    replace(/\b(mc|minecraft|Minecraft\.getInstance\(\))\.setScreen\(/, '$1.gui.setScreen(', /\b(mc|minecraft|Minecraft\.getInstance\(\))\.gui\.setScreen\(/, '$1.setScreen(')
}
stonecutter.replacements.regex(since('26.2')) {
    replace(/(net\.minecraft\.world\.entity\.)?\bEntityType\.PLAYER\b/, 'net.minecraft.world.entity.EntityTypes.PLAYER', /net\.minecraft\.world\.entity\.EntityTypes\.PLAYER/, 'EntityType.PLAYER')
}
// 26.1 moved the GUI's render state classes
stonecutter.replacements.string(since('26.1')) {
    replace('net.minecraft.client.gui.render.state.', 'net.minecraft.client.renderer.state.gui.')
}
// 26.3's renderer: its pipelines and textures moved
stonecutter.replacements.string(since('26.3')) {
    replace('com.mojang.blaze3d.pipeline.RenderPipeline', 'com.mojang.renderpearl.api.pipeline.RenderPipeline')
}
stonecutter.replacements.string(since('26.3')) {
    replace('com.mojang.blaze3d.textures.', 'com.mojang.renderpearl.api.textures.')
}
stonecutter.replacements.string(since('26.1')) {
    replace('net.minecraft.client.GuiMessage', 'net.minecraft.client.multiplayer.chat.GuiMessage')
}
// the same class in the mixins' descriptors
stonecutter.replacements.string(since('26.1')) {
    replace('Lnet/minecraft/client/GuiMessage;', 'Lnet/minecraft/client/multiplayer/chat/GuiMessage;')
}

// Minecraft 26.x comes with Mojang's own names (nothing to map); older ones obfuscated (Loom maps them)
def obfuscated = findProperty('obfuscated') != 'false'
if (loader == 'forge') {
    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'net.minecraftforge.jarjar'
} else {
    apply plugin: loader == 'neoforge' ? 'net.neoforged.moddev' : obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
}

version = mod_version
group = 'com.sinuxoff'
// named after its version folder (26.1-fabric: ingamemessenger-fabric-26.1), which may cover several releases
base { archivesName = "ingamemessenger-${loader}-${project.name - "-$loader"}" }

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.fabricmc.net/' }
}

// each loader's own package and files stay out of the other loaders' jars; the vanilla hook mixins are for loaders
// without the matching events (Fabric, Forge)
def otherLoaders = ['fabric', 'neoforge', 'forge'] - loader
def loaderFiles = [fabric: ['fabric.mod.json'], neoforge: ['META-INF/neoforge.mods.toml'], forge: ['META-INF/mods.toml', 'pack.mcmeta']]
sourceSets.main {
    java.srcDir rootProject.file('core/src/main/java')
    otherLoaders.each { java.exclude "com/sinuxoff/ingamemessenger/$it/**" }
    otherLoaders.each { resources.exclude loaderFiles[it] }
    if (loader == 'neoforge') {
        java.exclude 'com/sinuxoff/ingamemessenger/hooks/**'
        resources.exclude 'ingamemessenger.hooks.mixins.json'
    }
}

// the mod's version says which build it is (0.1.0+1.21.1-fabric); the Java the jar needs, and the newest one the
// mixin configs may name (Mixin knows up to 21)
def props = [version: "${version}+${project.name}", minecraft_range: minecraft_range, loader_range: loader_range, pack_meta: findProperty('pack_meta') ?: '',
             java: java_version, mixin_java: Math.min(java_version as int, 21)]

if (loader == 'neoforge') {
    neoForge {
        version = neo_version
        mods {
            ingamemessenger {
                sourceSet sourceSets.main
            }
        }
        runs {
            client {
                client()
            }
            server {
                server()
            }
        }
    }
    dependencies {
        // Opus in plain Java (Concentus, BSD), carried inside the mod's jar: voice messages need no other mod
        jarJar(implementation("io.github.jaredmdobson:concentus:${concentus_version}"))
        jarJar(implementation("com.h2database:h2:${h2_version}"))
    }
    tasks.named('processResources', ProcessResources) {
        inputs.properties props
        filesMatching(['META-INF/neoforge.mods.toml', '*.mixins.json']) { expand props }
    }
} else if (loader == 'forge') {
    minecraft {
        if (obfuscated) {
            mappings channel: 'official', version: mcVersion
        }
        runs {
            register('client')
            register('server') {
                args '--nogui'
            }
        }
    }
    repositories {
        minecraft.mavenizer(it)
        maven fg.forgeMaven
        maven fg.minecraftLibsMaven
    }
    jarJar.register()
    dependencies {
        implementation minecraft.dependency("net.minecraftforge:forge:${mcVersion}-${forge_version}")
        // carried inside the mod's jar; Forge ships MixinExtras itself only from 26.3
        implementation(jarJar("io.github.jaredmdobson:concentus:${concentus_version}")) { transitive = false }
        implementation(jarJar("com.h2database:h2:${h2_version}")) { transitive = false }
        compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
        if (!stonecutter.current.parsed.matches('>=26.3')) {
            implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")) { transitive = false }
        }
    }
    tasks.named('jar', Jar) {
        manifest.attributes('MixinConfigs': 'ingamemessenger.mixins.json,ingamemessenger.hooks.mixins.json')
        archiveClassifier = 'slim'
    }
    // the jar with the libraries inside is the one to install
    tasks.named('jarJar') {
        archiveClassifier = ''
    }
    tasks.named('processResources', ProcessResources) {
        inputs.properties props
        filesMatching(['META-INF/mods.toml', 'pack.mcmeta', '*.mixins.json']) { expand props }
    }
    // Forge before 1.20.6 runs on SRG names: the jar is renamed from Mojang's names, and the mixins get a refmap
    if (findProperty('mcp_version')) {
        apply plugin: 'net.minecraftforge.renamer'
        renamer.mappings("net.minecraft:mappings_official:${mcp_version}:map2srg@tsrg.gz")
        def mixins = renamer.enableMixinRefmaps {
            config 'ingamemessenger.mixins.json'
            config 'ingamemessenger.hooks.mixins.json'
            refMap = 'ingamemessenger.refmap.json'
        }
        mixins.jar(tasks.named('jarJar', Jar))
        dependencies {
            annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
            // MixinExtras' own injectors (@WrapOperation...) need its processor too, or they miss the refmap
            annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
        }
        tasks.named('processResources', ProcessResources) {
            inputs.property('refmap', 'ingamemessenger.refmap.json')
            filesMatching('*.mixins.json') {
                filter { it.replace('"compatibilityLevel"', '"refmap": "ingamemessenger.refmap.json", "compatibilityLevel"') }
            }
        }
        tasks.named('jarJar') {
            archiveClassifier = 'mojmap'
        }
        // the mixins' own shadows and overwrites are renamed too, with what the processor found
        def srgJar = renamer.classes(tasks.named('jarJar', Jar)) {
            map.setFrom(mixins.generatedMappings)
            archiveClassifier = ''
        }
        tasks.named('assemble') { dependsOn srgJar }
    }
} else {
    dependencies {
        minecraft "com.mojang:minecraft:${mcVersion}"
        if (obfuscated) {
            mappings loom.officialMojangMappings()
            modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        } else {
            implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        }
        // Opus in plain Java (Concentus, BSD), carried inside the mod's jar: voice messages need no other mod
        include(implementation("io.github.jaredmdobson:concentus:${concentus_version}"))
        include(implementation("com.h2database:h2:${h2_version}"))
    }
    tasks.named('processResources', ProcessResources) {
        inputs.properties props
        filesMatching(['fabric.mod.json', '*.mixins.json']) { expand props }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}
